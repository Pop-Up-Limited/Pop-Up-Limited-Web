<header class="sticky top-0 z-50 border-b border-slate-200/60 bg-white/80 backdrop-blur-md dark:border-slate-800/60 dark:bg-slate-900/70">
  <div class="container flex items-center justify-between px-4 py-4 md:px-6">
    <a href="/" class="flex items-center gap-3 text-lg font-bold text-foreground hover:text-brand-500 dark:text-foreground-dark" aria-label="Pop Up Limited home">
      <img src="/images/logo.svg" alt="Pop Up Limited logo" class="h-11 w-11" />
      <span class="text-balance">Pop Up Limited</span>
    </a>

    <div class="flex items-center gap-2 md:hidden">
      <!-- Language Switcher for Mobile -->
      <div class="flex items-center gap-1 rounded-full border border-slate-200 bg-white p-0.5 dark:border-slate-700 dark:bg-slate-800" data-language-switcher-mobile>
        <button
          type="button"
          data-lang="zh"
          class="rounded-full px-2 py-1 text-xs font-semibold transition-colors data-[active=true]:bg-brand-500 data-[active=true]:text-white data-[active=false]:text-slate-600 dark:data-[active=false]:text-slate-300"
          aria-label="切换到中文"
        >
          中
        </button>
        <button
          type="button"
          data-lang="en"
          class="rounded-full px-2 py-1 text-xs font-semibold transition-colors data-[active=true]:bg-brand-500 data-[active=true]:text-white data-[active=false]:text-slate-600 dark:data-[active=false]:text-slate-300"
          aria-label="Switch to English"
        >
          EN
        </button>
      </div>
      <button
        type="button"
        class="flex h-10 w-10 items-center justify-center rounded-full border border-slate-200 text-slate-600 transition hover:border-brand-300 hover:text-brand-600 focus-visible:ring-brand-300 dark:border-slate-700 dark:text-foreground-dark"
        aria-label="Toggle navigation"
        aria-controls="primary-navigation"
        aria-expanded="false"
        data-nav-toggle
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
    </div>

    <nav id="primary-navigation" class="hidden w-full flex-col gap-6 md:flex md:w-auto md:flex-row md:items-center md:gap-8" data-nav-menu>
      <ul class="flex flex-col gap-4 text-sm font-medium text-foreground md:flex-row md:items-center md:gap-6 dark:text-foreground-dark">
        <li>
          <a
            href="/"
            data-nav-link
            data-href="/"
            data-i18n="nav.home"
            class="rounded-full px-3 py-2 transition hover:bg-slate-100/80 hover:text-brand-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-300"
          >
            首页
          </a>
        </li>
        <li>
          <a
            href="/services.html"
            data-nav-link
            data-href="/services.html"
            data-i18n="nav.services"
            class="rounded-full px-3 py-2 transition hover:bg-slate-100/80 hover:text-brand-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-300"
          >
            服务方案
          </a>
        </li>
        <li>
          <a
            href="/cases.html"
            data-nav-link
            data-href="/cases.html"
            data-i18n="nav.cases"
            class="rounded-full px-3 py-2 transition hover:bg-slate-100/80 hover:text-brand-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-300"
          >
            案例库
          </a>
        </li>
        <li>
          <a
            href="/support.html"
            data-nav-link
            data-href="/support.html"
            data-i18n="nav.support"
            class="rounded-full px-3 py-2 transition hover:bg-slate-100/80 hover:text-brand-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-300"
          >
            支持中心
          </a>
        </li>
      </ul>
      <div class="flex flex-col gap-3 md:flex-row md:items-center md:gap-3">
        <!-- Language Switcher -->
        <div class="flex items-center gap-2 rounded-full border border-slate-200 bg-white p-1 dark:border-slate-700 dark:bg-slate-800" data-language-switcher>
          <button
            type="button"
            data-lang="zh"
            class="rounded-full px-3 py-1.5 text-xs font-semibold transition-colors data-[active=true]:bg-brand-500 data-[active=true]:text-white data-[active=false]:text-slate-600 hover:bg-slate-100 dark:data-[active=false]:text-slate-300 dark:hover:bg-slate-700"
            aria-label="切换到中文"
          >
            中文
          </button>
          <button
            type="button"
            data-lang="en"
            class="rounded-full px-3 py-1.5 text-xs font-semibold transition-colors data-[active=true]:bg-brand-500 data-[active=true]:text-white data-[active=false]:text-slate-600 hover:bg-slate-100 dark:data-[active=false]:text-slate-300 dark:hover:bg-slate-700"
            aria-label="Switch to English"
          >
            EN
          </button>
        </div>
        <a href="/support.html" class="btn-primary" data-i18n="nav.contactSupport">联系客服</a>
      </div>
    </nav>
  </div>
</header>
